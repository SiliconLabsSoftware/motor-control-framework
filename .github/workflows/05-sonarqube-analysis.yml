name: 05-SonarQube-Analysis

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - "release/**"
  push:
    branches:
      - main
      - master
      - develop
      - "release/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branches to run the workflow on"
        required: true
        default: "main"
      sonar-branch:
        description: "Sonar project branch name."
        required: false
        default: "default"

env:
  COMPONENTS: "simplefoc-port-mg24"
  PYTHON_VARIANTS: ""
  SONAR_HOST: "https://sonarqube.silabs.net"

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: large
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
          submodules: true
          fetch-depth: 0

      - name: Build Docker Image
        run: docker build -t ${{ github.event.repository.name }}-build-env:latest . --build-arg INSTALL_DOXYGEN=NO --build-arg INSTALL_SONARQUBE=YES

      - name: Full Analysis (Build & Scan)
        run: |
          mkdir -p .sonar_cache

          docker run --rm \
            -v "${{ github.workspace }}:/source:rw" \
            -v "${{ github.workspace }}/.sonar_cache:/root/.sonar/cache" \
            -w /source \
            -e SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}" \
            -e SONAR_HOST_URL="${{ env.SONAR_HOST }}" \
            -e SONAR_PR_KEY="${{ github.event.pull_request.number }}" \
            -e SONAR_PR_BRANCH="${{ github.head_ref }}" \
            -e SONAR_PR_BASE="${{ github.base_ref }}" \
            -e SONAR_BRANCH_NAME="${{ github.ref_name }}" \
            -e INPUT_BRANCH="${{ github.event.inputs.branch }}" \
            -e INPUT_SONAR_BRANCH="${{ github.event.inputs.sonar-branch }}" \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_SHA="${{ github.sha }}" \
            -e COMPONENTS="${{ env.COMPONENTS }}" \
            -e PYTHON_VARIANTS="${{ env.PYTHON_VARIANTS }}" \
            ${{ github.event.repository.name }}-build-env:latest \
            /bin/bash -c "
              chmod +x .github/sonar_build.sh .github/sonar_scanner.sh && \
              ./.github/sonar_build.sh all && \
              ./.github/sonar_scanner.sh | tee sonar.log
            " || { echo "Docker execution failed"; exit 1; }

          # Extract Task ID
          CE_TASK_ID=$(grep -oP 'id=\K[0-9a-f\-]{36}' sonar.log)
          if [ -z "$CE_TASK_ID" ]; then
            echo "Failed to extract ceTaskId from scanner output."
            cat sonar.log
            exit 1
          fi
          echo "CE_TASK_ID=$CE_TASK_ID" >> $GITHUB_ENV

      - name: Evaluate SonarQube Quality Gate
        run: |
          echo "Waiting for SonarQube analysis task ($CE_TASK_ID) to complete..."
          STATUS=""
          # Wait loop
          for i in $(seq 1 20); do
            sleep 10
            STATUS_JSON=$(curl -s -u ${{ secrets.SONAR_TOKEN }}: "${{ env.SONAR_HOST }}/api/ce/task?id=$CE_TASK_ID")
            STATUS=$(echo "$STATUS_JSON" | jq -r '.task.status')
            if [ "$STATUS" == "SUCCESS" ]; then
              break
            elif [ "$STATUS" == "FAILED" ]; then
              echo "SonarQube task failed."
              exit 1
            fi
          done

          ANALYSIS_ID=$(echo $STATUS_JSON | jq -r '.task.analysisId')
          if [ "$STATUS" != "SUCCESS" ]; then
            echo "SonarQube analysis did not complete successfully in time."
            exit 1
          fi

          QG_STATUS_JSON=$(curl -s -u ${{ secrets.SONAR_TOKEN }}: "${{ env.SONAR_HOST }}/api/qualitygates/project_status?analysisId=$ANALYSIS_ID")
          QG_STATUS=$(echo $QG_STATUS_JSON | jq -r '.projectStatus.status')
          echo "Sonar project page: ${{ env.SONAR_HOST }}/dashboard?id=${{ github.event.repository.name }}"
          echo "Quality Gate Status: $QG_STATUS"

          if [ "$QG_STATUS" != "OK" ]; then
            echo "Quality Gate failed: $QG_STATUS"
            exit 1
          fi

      - name: Clean up workspace
        if: always()
        run: |
          echo "Cleaning up generated files using Docker (to handle root permissions)..."
          docker run --rm \
            -v "${{ github.workspace }}:/source" \
            -w /source \
            ${{ github.event.repository.name }}-build-env:latest \
            /bin/bash -c " \
              set -euo pipefail; \
              rm -rf /source/.sonar_cache /source/.scannerwork /source/sonar-bw /source/sonar.log || echo '::warning::Failed to clean SonarQube cache files'; \
              # remove generated directories (build, .venv, __pycache__, artifact) recursively
              find /source -type d \( -name 'build' -o -name '.venv' -o -name '__pycache__' -o -name 'artifact' \) -prune -exec rm -rf {} + || echo '::warning::Failed to clean build directories'; \
              # remove generated files (*.pyc, .coverage, coverage reports) recursively
              find /source -type f \( -name '*.pyc' -o -name '.coverage' -o -name 'coverage*.xml' \) -delete || echo '::warning::Failed to clean Python artifacts'; \
            "

          echo "Cleaning Git workspace"
          git config --global --add safe.directory ${{ github.workspace }}
          git clean -ffdx
