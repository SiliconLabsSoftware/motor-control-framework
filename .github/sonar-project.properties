# sonar.host.url=Currently using github secret
# must be unique in a given SonarQube instance
# update this value based on the project name
sonar.projectKey=devs-simplefoc-port

sonar.cfamily.variants.names=simplefoc-port-thingplusmatter, simplefoc-port-brd4186c, simplefoc-port-brd4401c

sonar.cfamily.variants.dir = sonar-bw

# we don't care which version, SQ is just too dumb to ignore python language when it sees (even if we try excluding it in sonar.exclusions)
sonar.python.version=3.11

# Path is relative to the sonar-project.properties file. Defaults to .
sonar.sources= .

# Branch name for the analysis
# sonar.branch.name=Currently configured in the github action
#Exclusion list shall be updated as per the project requirement

sonar.exclusions= \
   resources/**/*, \
   projects/*/*simplicity*/**/*, \
   projects/*/config/**/*, \
   projects/*/autogen/**/*, \
   projects/external/**/*, \
   projects/common/simple_foc_platform_specific/MXLEMMING_observer/**/*, \
   projects/common/arduino_layer/generic/api/**/*

sonar.cpd.exclusions = \
   projects/common/simple_foc_platform_specific/**/*

sonar.coverage.exclusions = **
